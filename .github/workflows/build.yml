name: Build
on: [pull_request, workflow_dispatch]
jobs:
  cocoapods:
    name: CocoaPods (Xcode 27)
    runs-on: xcode-27-xlarge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Xcode 27
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -i 27 | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 27 install found on this runner. Installed Xcode apps:"
            ls /Applications | grep -i Xcode
            exit 1
          fi
          echo "Resolved Xcode path: $XCODE_PATH"
          sudo xcode-select -switch "$XCODE_PATH"
          xcodebuild -version
      - name: Install CocoaPod dependencies
        run: pod install
      - name: Run pod lib lint
        run: pod lib lint
  spm:
    name: SPM (Xcode 27)
    runs-on: xcode-27-xlarge
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Xcode 27
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -i 27 | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 27 install found on this runner. Installed Xcode apps:"
            ls /Applications | grep -i Xcode
            exit 1
          fi
          echo "Resolved Xcode path: $XCODE_PATH"
          sudo xcode-select -switch "$XCODE_PATH"
          xcodebuild -version
      - name: Use current branch
        run: sed -i '' 's/branch = .*/branch = \"'"${GITHUB_HEAD_REF//\//\/}"'\";/' SampleApps/SPMTest/SPMTest.xcodeproj/project.pbxproj
      - name: Run swift package resolve
        run: cd SampleApps/SPMTest && swift package resolve
      - name: Build & archive SPMTest
        run: xcodebuild -project 'SampleApps/SPMTest/SPMTest.xcodeproj' -scheme 'SPMTest' clean build archive CODE_SIGNING_ALLOWED=NO
